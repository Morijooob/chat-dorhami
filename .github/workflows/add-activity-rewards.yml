name: Add activity rewards
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch activity rewards
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path('index.js').read_text()
          app = Path('public/app.js').read_text()

          # Add persistent flower/reward state without touching existing data.
          old_schema = "is_vip INTEGER NOT NULL DEFAULT 0);"
          new_schema = "is_vip INTEGER NOT NULL DEFAULT 0, flowers INTEGER NOT NULL DEFAULT 0, last_activity_reward INTEGER NOT NULL DEFAULT 0);"
          if old_schema in index and 'flowers INTEGER NOT NULL DEFAULT 0' not in index:
              index = index.replace(old_schema, new_schema, 1)

          marker = '    try { this.ctx.storage.sql.exec("ALTER TABLE users ADD COLUMN is_vip INTEGER NOT NULL DEFAULT 0"); } catch (error) {}'
          if marker in index and 'ADD COLUMN flowers' not in index:
              index = index.replace(marker, marker + '\n    try { this.ctx.storage.sql.exec("ALTER TABLE users ADD COLUMN flowers INTEGER NOT NULL DEFAULT 0"); } catch (error) {}\n    try { this.ctx.storage.sql.exec("ALTER TABLE users ADD COLUMN last_activity_reward INTEGER NOT NULL DEFAULT 0"); } catch (error) {}', 1)

          # One reward per user per 24 hours. No automatic alarms/jobs are used.
          endpoint_marker = '      if (request.method === "GET" && url.pathname === "/profile/me")'
          endpoint = '''      if (request.method === "POST" && url.pathname === "/rewards/claim") {\n        const username = this.getSessionUsername(request);\n        if (!username) return json({ error: "برای دریافت پاداش باید وارد حساب خودت باشی." }, 401);\n        const rows = this.ctx.storage.sql.exec("SELECT flowers, last_activity_reward FROM users WHERE username = ? LIMIT 1", username).toArray();\n        if (!rows.length) return json({ error: "کاربر پیدا نشد." }, 404);\n        const now = Date.now();\n        const last = Number(rows[0].last_activity_reward || 0);\n        const flowers = Number(rows[0].flowers || 0);\n        if (now - last < 86400000) return json({ ok: true, rewarded: false, flowers });\n        const nextFlowers = flowers + 10;\n        this.ctx.storage.sql.exec("UPDATE users SET flowers = ?, last_activity_reward = ? WHERE username = ?", nextFlowers, now, username);\n        return json({ ok: true, rewarded: true, flowers: nextFlowers, gift: 10 });\n      }\n\n'''
          if '/rewards/claim' not in index:
              if endpoint_marker not in index:
                  raise SystemExit('profile endpoint marker not found')
              index = index.replace(endpoint_marker, endpoint + endpoint_marker, 1)

          # Show a lightweight toast when the daily activity gift is actually granted.
          toast_fn = '''function showActivityRewardToast(text) {\n  let toast = document.getElementById('activityRewardToast');\n  if (!toast) {\n    toast = document.createElement('div');\n    toast.id = 'activityRewardToast';\n    toast.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:9999;padding:12px 18px;border-radius:999px;background:rgba(25,25,35,.94);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;';\n    document.body.appendChild(toast);\n  }\n  toast.textContent = text;\n  toast.style.opacity = '1';\n  clearTimeout(window.activityRewardToastTimer);\n  window.activityRewardToastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2800);\n}\n\n'''
          if 'function showActivityRewardToast' not in app:
              marker2 = 'async function updatePresence() {'
              if marker2 not in app:
                  raise SystemExit('updatePresence marker not found')
              app = app.replace(marker2, toast_fn + marker2, 1)

          claim_line = "    const reward = await api('/rewards/claim', { method: 'POST', body: JSON.stringify({}) });\n    if (reward.rewarded) showActivityRewardToast('🎁 پاداش فعالیت: ۱۰ 🌹 گل به حسابت اضافه شد!');"
          presence_line = "    await api('/presence', { method: 'POST', body: JSON.stringify({ username }) });"
          if "/rewards/claim" not in app:
              if presence_line not in app:
                  raise SystemExit('presence POST marker not found')
              app = app.replace(presence_line, presence_line + '\n' + claim_line, 1)

          Path('index.js').write_text(index)
          Path('public/app.js').write_text(app)
          PY

          git diff --check
          git diff -- index.js public/app.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js public/app.js
          git commit -m "Add daily activity flower reward" || true
          git rm .github/workflows/add-activity-rewards.yml
          git commit -m "Remove temporary reward patch workflow"
          git push
