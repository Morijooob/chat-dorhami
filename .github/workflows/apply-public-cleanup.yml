name: Apply public chat cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Durable Object cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.js')
          text = path.read_text(encoding='utf-8')

          old = '  constructor(ctx, env) { super(ctx, env); this.ready = this.initialize(); this.typing = new Map(); }'
          new = '''  constructor(ctx, env) { super(ctx, env); this.ready = this.initialize(); this.typing = new Map(); }\n\n  static PUBLIC_CLEANUP_INTERVAL_MS = 6 * 60 * 60 * 1000;\n\n  async ensurePublicCleanupAlarm() {\n    try {\n      const currentAlarm = await this.ctx.storage.getAlarm();\n      if (currentAlarm == null) await this.ctx.storage.setAlarm(Date.now() + ChatRoom.PUBLIC_CLEANUP_INTERVAL_MS);\n    } catch (error) {\n      console.error('Public cleanup alarm setup failed:', error);\n    }\n  }\n\n  async alarm() {\n    try {\n      this.ctx.storage.sql.exec('DELETE FROM messages');\n    } finally {\n      await this.ctx.storage.setAlarm(Date.now() + ChatRoom.PUBLIC_CLEANUP_INTERVAL_MS);\n    }\n  }'''
          if old not in text:
              raise SystemExit('Constructor anchor not found; refusing patch.')
          if 'PUBLIC_CLEANUP_INTERVAL_MS' in text or 'async alarm(' in text:
              raise SystemExit('Cleanup code already exists; refusing duplicate patch.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/apply-public-cleanup.yml
          git commit -m "feat: automatically clean public chat every 6 hours"
          git rm .github/workflows/apply-public-cleanup.yml
          git commit -m "chore: remove one-time cleanup workflow"
          git push
