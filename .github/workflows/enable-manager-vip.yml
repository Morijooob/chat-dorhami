name: Enable manager VIP

on:
  push:
    paths:
      - .github/workflows/enable-manager-vip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable VIP toggle for manager
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          old = 'if (username === "Morteza2026") return json({ error: "حساب مدیر نیازی به VIP ندارد." }, 400); '
          if old not in s:
              raise SystemExit('target guard not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "fix: allow manager VIP toggle from admin panel"
          git push
