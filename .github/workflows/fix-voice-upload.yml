name: Fix voice upload parser

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.issue.title, 'VOICE_UPLOAD_FIX_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch multipart voice upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          old = '''const mime = String(request.headers.get("content-type") || "").split(";")[0].trim().toLowerCase();
        const allowed = new Set(["audio/webm","audio/ogg","audio/mp4","audio/mpeg","audio/wav","audio/x-wav"]);
        if (!allowed.has(mime)) return json({ error: "فرمت صوتی پشتیبانی نمی‌شود." }, 415);
        const contentLength = Number(request.headers.get("content-length") || 0);
        if (contentLength > 2 * 1024 * 1024) return json({ error: "حجم ویس حداکثر ۲ مگابایت باشد." }, 413);
        const data = await request.arrayBuffer();
        if (!data.byteLength || data.byteLength > 2 * 1024 * 1024) return json({ error: "حجم ویس حداکثر ۲ مگابایت باشد." }, 413);'''
          new = '''const contentLength = Number(request.headers.get("content-length") || 0);
        if (contentLength > 3 * 1024 * 1024) return json({ error: "حجم ویس حداکثر ۲ مگابایت باشد." }, 413);
        const form = await request.formData();
        const file = form.get("file");
        if (!(file instanceof File)) return json({ error: "فایل ویس ارسال نشده است." }, 400);
        const mime = String(file.type || "").split(";")[0].trim().toLowerCase();
        const allowed = new Set(["audio/webm","audio/ogg","audio/mp4","audio/mpeg","audio/wav","audio/x-wav"]);
        if (!allowed.has(mime)) return json({ error: "فرمت صوتی پشتیبانی نمی‌شود." }, 415);
        if (!file.size || file.size > 2 * 1024 * 1024) return json({ error: "حجم ویس حداکثر ۲ مگابایت باشد." }, 413);
        const data = await file.arrayBuffer();
        if (!data.byteLength || data.byteLength > 2 * 1024 * 1024) return json({ error: "حجم ویس حداکثر ۲ مگابایت باشد." }, 413);'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "Fix multipart voice upload parser"
          git push
