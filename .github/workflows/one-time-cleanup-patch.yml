name: One-time public cleanup patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: prepare cleanup patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Durable Object cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.js')
          text = path.read_text(encoding='utf-8')

          old_constructor = '''  constructor(ctx, env) {\n    super(ctx, env);\n    this.ctx = ctx;\n    this.env = env;\n\n    this.initDatabase();\n  }'''

          new_constructor = '''  constructor(ctx, env) {\n    super(ctx, env);\n    this.ctx = ctx;\n    this.env = env;\n\n    this.initDatabase();\n\n    // Public chat history is cleaned automatically every 6 hours.\n    // Never replace an existing alarm (important when the alarm wakes the DO).\n    this.ensurePublicCleanupAlarm();\n  }'''

          if old_constructor not in text:
              raise SystemExit('Expected constructor anchor was not found; refusing to modify index.js.')

          if 'ensurePublicCleanupAlarm()' in text or 'async alarm(alarmInfo)' in text:
              raise SystemExit('Cleanup alarm code already exists; refusing duplicate patch.')

          anchor = '''  getBearerToken(\n    request\n  ) {'''
          methods = '''  static PUBLIC_CLEANUP_INTERVAL_MS = 6 * 60 * 60 * 1000;\n\n  async ensurePublicCleanupAlarm() {\n    try {\n      const currentAlarm = await this.ctx.storage.getAlarm();\n      if (currentAlarm == null) {\n        await this.ctx.storage.setAlarm(\n          Date.now() + ChatRoom.PUBLIC_CLEANUP_INTERVAL_MS\n        );\n      }\n    } catch (error) {\n      console.error('Public cleanup alarm setup failed:', error);\n    }\n  }\n\n  async alarm(alarmInfo) {\n    try {\n      // Only the main public group is cleaned. Private chats and private/VIP rooms stay intact.\n      this.ctx.storage.sql.exec(\n        `DELETE FROM messages WHERE room_id = ?`,\n        'public-main'\n      );\n    } finally {\n      // Re-arm the recurring cleanup alarm.\n      await this.ctx.storage.setAlarm(\n        Date.now() + ChatRoom.PUBLIC_CLEANUP_INTERVAL_MS\n      );\n    }\n  }\n\n'''

          if anchor not in text:
              raise SystemExit('Expected getBearerToken anchor was not found; refusing to modify index.js.')

          text = text.replace(old_constructor, new_constructor, 1)
          text = text.replace(anchor, methods + anchor, 1)
          path.write_text(text, encoding='utf-8')

          print('Patched index.js successfully.')

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/one-time-cleanup-patch.yml
          git commit -m "feat: auto-clean public chat every 6 hours"
          git rm .github/workflows/one-time-cleanup-patch.yml
          git commit -m "chore: remove one-time cleanup workflow"
          git push
