name: optimize typing polling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce typing polling traffic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/typing.js')
          s = p.read_text(encoding='utf-8')
          old = 'pollTimer = setInterval(pollTyping, 1500);'
          new = 'pollTimer = setInterval(pollTyping, 5000);'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit optimization and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/typing.js .github/workflows/optimize-typing-poll.yml
          git commit -m 'perf: reduce typing polling requests' --no-verify
          git rm .github/workflows/optimize-typing-poll.yml
          git commit -m 'chore: remove temporary optimization workflow' --no-verify
          git push
