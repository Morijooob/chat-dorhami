<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت کاربران | دورهمی</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#25204a 0,#0b1022 45%,#060914 100%)}.wrap{width:min(760px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:22px;font-weight:900}.sub{font-size:10px;color:#94a3b8;margin-top:6px}.back{color:#fff;text-decoration:none;padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.05);font-size:10px}.panel{border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(13,18,38,.84);padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.status{color:#a7f3d0;font-size:10px;margin-bottom:14px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);color:#fff;outline:0;font:inherit;font-size:11px;margin-bottom:12px}.user{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.03);cursor:pointer;transition:.18s}.user:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}.avatar{width:40px;text-align:center;font-size:26px}.info{flex:1;min-width:0}.name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:9px;color:#64748b;margin-top:4px}.blocked{color:#fca5a5}.count{font-size:10px;color:#94a3b8;margin-bottom:10px}.empty{text-align:center;color:#94a3b8;font-size:10px;padding:22px}.error{padding:14px;border-radius:12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fecaca;font-size:10px;line-height:1.8}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(420px,100%);border:1px solid rgba(255,255,255,.12);border-radius:22px;background:#10162d;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}.bigavatar{font-size:48px}.selected{font-size:16px;font-weight:900;margin:8px 0 4px}.hint{font-size:10px;color:#94a3b8;margin-bottom:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.action{width:100%;padding:11px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:11px;cursor:pointer}.action.starred{background:rgba(250,204,21,.14);border-color:rgba(250,204,21,.35);color:#fde68a}.action.crowned{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.38);color:#e9d5ff}.action.blocked{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35);color:#fecaca}.close{width:100%;padding:11px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font:inherit;cursor:pointer}
@media(max-width:600px){body{padding:12px}.head{align-items:flex-start}.title{font-size:18px}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="title">👥 مدیریت کاربران</div><div class="sub">فهرست کاربران ثبت‌نام‌شده دورهمی</div></div><a class="back" href="/admin-panel.html">← پنل مدیریت</a></header><section class="panel"><div id="status" class="status">در حال بررسی دسترسی مدیر…</div><input id="search" class="search" placeholder="جستجوی نام کاربری…" hidden><div id="count" class="count" hidden></div><div id="list"><div class="empty">لطفاً صبر کن…</div></div></section></main>
<div id="modal" class="modal"><div class="box"><div id="modalAvatar" class="bigavatar">👤</div><div id="modalName" class="selected">کاربر</div><div id="modalHint" class="hint">برای این کاربر یک مدیریت انتخاب کن.</div><div class="actions"><button id="starBtn" class="action">⭐ دادن ستاره</button><button id="crownBtn" class="action">👑 دادن تاج</button><button id="blockBtn" class="action">🚫 مسدود کردن</button></div><button id="close" class="close">بستن</button></div></div>
<script>
const $=s=>document.querySelector(s);let users=[];let selectedUser='';let selectedStarred=false;let selectedCrowned=false;let selectedBlocked=false;
function render(){const q=$('#search').value.trim().toLowerCase();const filtered=users.filter(u=>String(u.username||'').toLowerCase().includes(q));$('#count').textContent=`${filtered.length} کاربر`;$('[id="list"]').innerHTML=filtered.length?filtered.map(u=>{const name=String(u.username||'کاربر').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const av=String(u.avatar||'👤').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const star=Number(u.is_starred)===1;const crown=Number(u.is_crowned)===1;const blocked=Number(u.is_blocked)===1;return `<div class="user" data-username="${name}"><div class="avatar">${av}</div><div class="info"><div class="name">${name} ${star?'⭐':''} ${crown?'👑':''} ${blocked?'🚫':''}</div><div class="meta ${blocked?'blocked':''}">${blocked?'مسدود توسط مدیریت':'کاربر ثبت‌نام‌شده • برای مدیریت کلیک کن'}</div></div></div>`}).join(''):'<div class="empty">کاربری پیدا نشد.</div>';document.querySelectorAll('.user').forEach(el=>el.addEventListener('click',()=>{const u=users.find(item=>String(item.username||'')===el.dataset.username)||{};openUser(u)}))}
function openUser(u){selectedUser=String(u.username||'');selectedStarred=Number(u.is_starred)===1;selectedCrowned=Number(u.is_crowned)===1;selectedBlocked=Number(u.is_blocked)===1;$('#modalAvatar').textContent=String(u.avatar||'👤');$('#modalName').textContent=selectedUser||'کاربر';updateButtons();$('#modal').classList.add('show')}
function updateButtons(){const on=selectedStarred;$('#starBtn').textContent=on?'⭐ برداشتن ستاره':'⭐ دادن ستاره';$('#starBtn').classList.toggle('starred',on);const crown=selectedCrowned;$('#crownBtn').textContent=crown?'👑 برداشتن تاج':'👑 دادن تاج';$('#crownBtn').classList.toggle('crowned',crown);$('#blockBtn').textContent=selectedBlocked?'🔓 رفع مسدودی':'🚫 مسدود کردن';$('#blockBtn').classList.toggle('blocked',selectedBlocked);$('#blockBtn').disabled=selectedUser==='Morteza2026';$('#crownBtn').disabled=selectedUser==='Morteza2026';$('#modalHint').textContent=selectedBlocked?'این حساب توسط مدیریت مسدود شده است.':selectedUser==='Morteza2026'?'حساب مدیر برای رتبه‌بندی کاربری در نظر گرفته نشده است.':'برای این کاربر یک مدیریت انتخاب کن.'}
$('#starBtn').addEventListener('click',async()=>{if(!selectedUser)return;const next=!selectedStarred;$('#starBtn').disabled=true;try{const response=await fetch('/admin/user-star',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:selectedUser,starred:next})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'ذخیره ستاره انجام نشد.');selectedStarred=Number(data.is_starred)===1;const user=users.find(item=>String(item.username||'')===selectedUser);if(user)user.is_starred=selectedStarred?1:0;updateButtons();render()}catch(error){alert(error.message)}finally{$('#starBtn').disabled=false}});
$('#crownBtn').addEventListener('click',async()=>{if(!selectedUser||selectedUser==='Morteza2026')return;const next=!selectedCrowned;$('#crownBtn').disabled=true;try{const response=await fetch('/admin/user-crown',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:selectedUser,crowned:next})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'ذخیره تاج انجام نشد.');selectedCrowned=Number(data.is_crowned)===1;const user=users.find(item=>String(item.username||'')===selectedUser);if(user)user.is_crowned=selectedCrowned?1:0;updateButtons();render()}catch(error){alert(error.message)}finally{$('#crownBtn').disabled=selectedUser==='Morteza2026'}});
$('#blockBtn').addEventListener('click',async()=>{if(!selectedUser||selectedUser==='Morteza2026')return;const next=!selectedBlocked;const question=next?'این کاربر مسدود شود؟':'مسدودی این کاربر برداشته شود؟';if(!confirm(question))return;$('#blockBtn').disabled=true;try{const response=await fetch('/admin/user-block',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:selectedUser,blocked:next})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'تغییر وضعیت کاربر انجام نشد.');selectedBlocked=Number(data.is_blocked)===1;const user=users.find(item=>String(item.username||'')===selectedUser);if(user)user.is_blocked=selectedBlocked?1:0;updateButtons();render()}catch(error){alert(error.message)}finally{$('#blockBtn').disabled=selectedUser==='Morteza2026'}});
$('#close').addEventListener('click',()=>$('#modal').classList.remove('show'));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
(async()=>{try{const a=await fetch('/admin',{credentials:'same-origin',cache:'no-store'});const ad=await a.json().catch(()=>({}));if(!a.ok)throw new Error(ad.error||'دسترسی غیرمجاز.');const r=await fetch('/users',{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'دریافت کاربران انجام نشد.');users=Array.isArray(d.users)?d.users:[];$('#status').textContent='دسترسی مدیر تأیید شد • '+String(ad.admin||'مدیر');$('#search').hidden=false;$('#count').hidden=false;render();$('#search').addEventListener('input',render)}catch(e){$('#status').textContent='دسترسی تأیید نشد';$('#list').innerHTML=`<div class="error">${String(e.message||'خطا').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>`}})();
</script></body></html>
