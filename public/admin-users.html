<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت کاربران | دورهمی</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#25204a 0,#0b1022 45%,#060914 100%)}.wrap{width:min(760px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:22px;font-weight:900}.sub{font-size:10px;color:#94a3b8;margin-top:6px}.back{color:#fff;text-decoration:none;padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.05);font-size:10px}.panel{border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(13,18,38,.84);padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.status{color:#a7f3d0;font-size:10px;margin-bottom:14px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);color:#fff;outline:0;font:inherit;font-size:11px;margin-bottom:12px}.user{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.03)}.avatar{width:40px;text-align:center;font-size:26px}.info{flex:1;min-width:0}.name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:9px;color:#64748b;margin-top:4px}.count{font-size:10px;color:#94a3b8;margin-bottom:10px}.empty{text-align:center;color:#94a3b8;font-size:10px;padding:22px}.error{padding:14px;border-radius:12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fecaca;font-size:10px;line-height:1.8}@media(max-width:600px){body{padding:12px}.head{align-items:flex-start}.title{font-size:18px}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="title">👥 مدیریت کاربران</div><div class="sub">فهرست کاربران ثبت‌نام‌شده دورهمی</div></div><a class="back" href="/admin-panel.html">← پنل مدیریت</a></header><section class="panel"><div id="status" class="status">در حال بررسی دسترسی مدیر…</div><input id="search" class="search" placeholder="جستجوی نام کاربری…" hidden><div id="count" class="count" hidden></div><div id="list"><div class="empty">لطفاً صبر کن…</div></div></section></main>
<script>
const $=s=>document.querySelector(s);let users=[];
function render(){const q=$('#search').value.trim().toLowerCase();const filtered=users.filter(u=>String(u.username||'').toLowerCase().includes(q));$('#count').textContent=`${filtered.length} کاربر`;$('#list').innerHTML=filtered.length?filtered.map(u=>{const name=String(u.username||'کاربر').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const av=String(u.avatar||'👤').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));return `<div class="user"><div class="avatar">${av}</div><div class="info"><div class="name">${name}</div><div class="meta">کاربر ثبت‌نام‌شده</div></div></div>`}).join(''):'<div class="empty">کاربری پیدا نشد.</div>'}
(async()=>{try{const a=await fetch('/admin',{credentials:'same-origin',cache:'no-store'});const ad=await a.json().catch(()=>({}));if(!a.ok)throw new Error(ad.error||'دسترسی غیرمجاز.');const r=await fetch('/users',{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'دریافت کاربران انجام نشد.');users=Array.isArray(d.users)?d.users:[];$('#status').textContent='دسترسی مدیر تأیید شد • '+String(ad.admin||'مدیر');$('#search').hidden=false;$('#count').hidden=false;render();$('#search').addEventListener('input',render)}catch(e){$('#status').textContent='دسترسی تأیید نشد';$('#list').innerHTML=`<div class="error">${String(e.message||'خطا').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>`}})();
</script></body></html>
