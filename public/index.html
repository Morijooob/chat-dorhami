<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17212b"><title>دورهمی مون | چت روم فارسی</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="auth" class="page"><div class="auth"><div class="logo">💬</div><h1>دورهمی مون</h1><p>یک چت‌روم ساده، سریع و صمیمی برای گپ زدن با هم.</p><div class="tabs"><button data-mode="login" class="active">ورود</button><button data-mode="register">ثبت‌نام</button></div><form id="authForm"><label>نام کاربری<input id="username" required minlength="3" maxlength="24" autocomplete="username"></label><label>رمز عبور<input id="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password"></label><button id="submit" class="primary">ورود به دورهمی</button></form><div id="authMsg"></div></div></div>
<div id="chat" class="hidden app"><aside><header><div><b>💬 دورهمی مون</b><small id="me"></small></div><button id="logout">خروج</button></header><div id="publicRoom" class="room active">💬 <span>اتاق عمومی</span><small id="online">۰ آنلاین</small></div><section class="privateChats"><h3>گفتگوهای خصوصی</h3><div id="privateChats"></div></section><h3>کاربران آنلاین</h3><div id="users"></div></aside><main><header><button id="mobileBack" class="hidden">☰</button><div><b id="chatTitle">اتاق عمومی</b><small id="chatSubtitle">گفتگوی زنده</small><small id="typing" class="typing"></small></div><button id="backPublic" class="hidden">اتاق عمومی</button></header><div id="messages"></div><form id="send"><input id="message" maxlength="2000" placeholder="پیامت را بنویس..." autocomplete="off"><button>ارسال</button></form></main></div>
<div id="toast"></div><script src="/app.js"></script></body></html>
