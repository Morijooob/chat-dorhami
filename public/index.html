<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>چت دورهمی</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section id="auth" class="card">
      <h1>چت دورهمی</h1>
      <p class="muted">نسخه پایه — مرحله اول</p>
      <div class="tabs">
        <button id="loginTab" class="active">ورود</button>
        <button id="registerTab">ثبت نام</button>
      </div>
      <input id="username" autocomplete="username" placeholder="نام کاربری">
      <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">
      <button id="submit" class="primary">ورود</button>
      <p id="authError" class="error"></p>
    </section>

    <section id="chat" class="chat hidden">
      <header><strong>اتاق عمومی دورهمی</strong><button id="logout">خروج</button></header>
      <div id="messages" class="messages"></div>
      <form id="sendForm" class="send"><input id="message" maxlength="1000" placeholder="پیامت را بنویس..."><button>ارسال</button></form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
