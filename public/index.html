<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="چت دورهمی؛ یک جای خودمونی برای گپ و آشنایی">
  <title>چت دورهمی</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="app">

    <!-- LOGIN / REGISTER -->
    <section id="auth" class="auth-screen">

      <div class="auth-card">

        <div class="brand">
          <div class="brand-icon">💬</div>
          <div>
            <div class="brand-name">چت دورهمی</div>
            <div class="brand-subtitle">گپ بزن، آشنا شو، دورهم باش</div>
          </div>
        </div>

        <div class="welcome">
          <h1>خوش اومدی 👋</h1>
          <p>برای ورود به دورهمی وارد حساب خودت شو.</p>
        </div>

        <div class="tabs">
          <button type="button" class="active" data-mode="login">
            ورود
          </button>

          <button type="button" data-mode="register">
            ثبت‌نام
          </button>
        </div>

        <form id="authForm" class="auth-form">

          <label>
            <span>نام کاربری</span>
            <input
              id="username"
              placeholder="مثلاً mori123"
              autocomplete="username"
              autocapitalize="none"
              required
            >
          </label>

          <label>
            <span>رمز عبور</span>
            <input
              id="password"
              type="password"
              placeholder="حداقل ۸ کاراکتر"
              autocomplete="current-password"
              required
            >
          </label>

          <button class="primary" type="submit">
            ورود به دورهمی
          </button>

        </form>

        <div id="authError" class="error"></div>

        <div class="auth-footer">
          🔐 اطلاعات حساب تو خصوصی می‌مونه
        </div>

      </div>

    </section>


    <!-- CHAT -->
    <section id="chat" class="chat hidden">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <header class="sidebar-header">

          <div class="profile-mini">

            <div class="avatar me-avatar">م</div>

            <div class="profile-text">
              <strong>چت دورهمی</strong>
              <small id="me"></small>
            </div>

          </div>

          <button id="logout" class="icon-button" title="خروج">
            ⎋
          </button>

        </header>


        <div class="sidebar-title">
          <span>گفتگوها</span>
          <span class="online-badge">● آنلاین</span>
        </div>


        <!-- PUBLIC ROOM -->
        <button id="publicRoom" class="room-card">

          <div class="room-icon">
            🌟
          </div>

          <div class="room-info">
            <strong>اتاق دورهمی</strong>
            <small>گفتگوی عمومی</small>
          </div>

          <span class="room-arrow">‹</span>

        </button>


        <!-- SEARCH -->
        <div class="search-box">

          <span>⌕</span>

          <input
            id="search"
            type="search"
            placeholder="جستجوی کاربران..."
            autocomplete="off"
          >

        </div>


        <div class="section-title">
          گفتگوی خصوصی
        </div>

        <div id="users" class="users"></div>

      </aside>


      <!-- CHAT AREA -->
      <article class="chat-area">

        <!-- EMPTY -->
        <div id="empty" class="empty">

          <div class="empty-logo">
            💬
          </div>

          <h2>به چت دورهمی خوش اومدی</h2>

          <p>
            یک نفر را برای گفتگوی خصوصی انتخاب کن
            یا وارد اتاق عمومی شو.
          </p>

          <button
            class="empty-action"
            onclick="document.getElementById('publicRoom').click()"
          >
            ورود به اتاق دورهمی
          </button>

        </div>


        <!-- CONVERSATION -->
        <div id="conversation" class="conversation hidden">

          <header class="conversation-header">

            <div class="conversation-user">

              <div class="avatar conversation-avatar">
                💬
              </div>

              <div>

                <strong id="chatWith">
                  چت
                </strong>

                <small id="status">
                  آفلاین
                </small>

              </div>

            </div>

            <button id="backBtn" class="back">
              بازگشت
            </button>

          </header>


          <div id="messages" class="messages"></div>


          <form id="sendForm" class="message-form">

            <input
              id="message"
              placeholder="پیامت را بنویس..."
              maxlength="2000"
              autocomplete="off"
            >

            <button type="submit" class="send-button">
              <span>ارسال</span>
              ➤
            </button>

          </form>

        </div>

      </article>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
