<!doctype html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7657ff">
  <title>چت دورهمی</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<main class="app"><section id="auth" class="card">
  <div class="logo">💬</div>
  <h1>چت دورهمی</h1>
  <p>یک جای خودمونی برای گپ و آشنایی</p>  <div class="tabs">
    <button class="active" data-mode="login">ورود</button>
    <button data-mode="register">ثبت‌نام</button>
  </div>  <form id="authForm">
    <input id="username" placeholder="نام کاربری انگلیسی" autocomplete="username" required>
    <input id="password" type="password" placeholder="رمز عبور (حداقل ۸ کاراکتر)" autocomplete="current-password" required>
    <button class="primary" type="submit">ورود</button>
  </form>  <div id="authError" class="error"></div>
</section><section id="chat" class="chat hidden"><aside>
<header>
  <div>
    <b>چت دورهمی</b>
    <small id="me"></small>
  </div>
  <button id="logout">خروج</button>
</header><div class="roomCard" id="publicRoom">
  <span>🌟</span>
  <div>
    <b>اتاق دورهمی</b>
    <small>گفتگوی عمومی</small>
  </div>
</div><input id="search" placeholder="جستجوی کاربران..."><div class="sectionTitle">گفتگوی خصوصی</div>
<div id="users" class="users"></div>
</aside><article><div id="empty" class="empty">
  <div>💬</div>
  <h2>به دورهمی خوش آمدی</h2>
  <p>اتاق عمومی را باز کن یا یک کاربر را انتخاب کن.</p>
</div><div id="conversation" class="conversation hidden"><header>
  <div>
    <b id="chatWith"></b>
    <small id="status"></small>
  </div>
  <button id="backBtn" class="back">بازگشت</button>
</header><div id="messages" class="messages"></div><form id="sendForm">
  <input id="message" placeholder="پیامت را بنویس..." maxlength="2000" autocomplete="off">
  <button>ارسال</button>
</form></div>
</article>
</section>
</main><script src="app.js"></script></body>
</html>
