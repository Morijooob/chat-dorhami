<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>چت دورهمی | گپ دوستانه</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aurora aurora-a"></div>
  <div class="aurora aurora-b"></div>
  <div class="stars"></div>

  <main class="shell">
    <section class="hero" id="authView">
      <div class="brand"><span class="brand-mark">💬</span><span>چت دورهمی</span></div>
      <div class="hero-copy">
        <span class="eyebrow">یک جمع صمیمی، همیشه آنلاین</span>
        <h1>اینجا جای <span>گپ‌های خوبه</span> ✨</h1>
        <p>ثبت‌نام کن، وارد اتاق عمومی شو و با آدم‌های جدید گفتگو کن.</p>
      </div>

      <div class="auth-card glass">
        <div class="tabs">
          <button class="tab active" data-mode="login">ورود</button>
          <button class="tab" data-mode="register">ثبت‌نام</button>
        </div>
        <form id="authForm">
          <label>نام کاربری<input id="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="مثلاً mori"></label>
          <label>رمز عبور<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="حداقل ۶ کاراکتر"></label>
          <button class="primary" type="submit"><span id="authText">وارد شدن</span><span>←</span></button>
          <div class="status" id="authStatus" role="status"></div>
        </form>
      </div>
    </section>

    <section class="chat glass hidden" id="chatView">
      <header class="chat-head">
        <div class="room-title"><span class="online-dot"></span><div><strong>اتاق عمومی دورهمی</strong><small id="onlineText">آماده گفتگو</small></div></div>
        <button class="logout" id="logout">خروج</button>
      </header>
      <div class="messages" id="messages"><div class="welcome"><b>به دورهمی خوش اومدی 🌙</b><span>اولین پیام رو تو بفرست!</span></div></div>
      <form class="composer" id="messageForm">
        <input id="messageInput" maxlength="1000" autocomplete="off" placeholder="پیامت رو بنویس...">
        <button aria-label="ارسال" type="submit">➤</button>
      </form>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
